rimary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(23,105,170,.14)}.btn.primary:hover{background:var(--blue2)}.section{display:none}.section.active{display:block}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.metric{padding:17px}.metric label{color:var(--muted);font-size:11px;font-weight:750}.metric .value{font-size:27px;font-weight:850;letter-spacing:-.8px;margin:8px 0 2px}.hint{font-size:11px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;margin-bottom:16px}.grid2b{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 19px 10px}.head h2{font-size:14px;margin:0}.sub{color:var(--muted);font-size:11px}.chartbox{height:235px;padding:0 16px 16px}.chartbox svg{width:100%;height:100%}.axis{stroke:var(--line);stroke-width:1}.cline{fill:none;stroke:var(--blue2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.goal{padding:0 19px 18px}.goal .amount{font-size:23px;font-weight:850;margin:7px 0}.progress{height:8px;background:var(--line);border-radius:20px;overflow:hidden;margin:12px 0 7px}.progress span{display:block;height:100%;background:var(--blue2);border-radius:20px}.goalfoot{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.jobs{padding:0 19px 10px}.job{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.datebox{width:40px;height:42px;border-radius:8px;background:var(--bg);display:grid;place-items:center;align-content:center}.datebox b{font-size:15px}.datebox small{font-size:9px;color:var(--muted);text-transform:uppercase}.jobinfo{flex:1;min-width:0}.jobinfo b{display:block;font-size:12px}.jobinfo small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow: <div class="app">
<aside class="side"><div class="brand"><div class="logo">✦</div><div class="brandtext"><b>Cool Dudes<br>Window Cleaning</b><small>FIELD DESK</small></div></div><div class="navtitle">WORKSPACE</div><nav class="nav"><button class="active" data-page="Dashboard"><span class="ico">▦</span><span class="navtext">Dashboard</span></button><button data-page="Customers"><span class="ico">♙</span><span class="navtext">Customers</span></button><button data-page="Bookings"><span class="ico">▣</span><span class="navtext">Bookings</span></button><button data-page="Leads"><span class="ico">◎</span><span class="navtext">Leads</span></button><button data-page="Territory" style="display:none"><span class="ico">⌖</span><span class="navtext">Territory</span></button><button data-page="Finances"><span class="ico">＄</span><span class="navtext">Finances</span></button><button data-page="Account"><span class="ico">⚙</span><span class="navtext">Account</span></button></nav><div class="sidefoot"><div class="owner"><div class="avatar" id="avatar">J</div><div class="sidewords"><b id="ownerName">Jacob</b><br><span>Owner workspace</span></div></div><span id="saveState">● Saved on this device</span></div></aside>

</main></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),iso=d=>d.toISOString().slice(0,10),today=new Date(),KEY='cooldudes-fielddesk-v2';
const defaults={profile:{name:'Jacob',business:'Cool Dudes Window Cleaning',phone:'',email:'',goal:1000,signedIn:false},customers:[],bookings:[],leads:[],expenses:[],doors:[],territories:[],settings:{googleKey:'',aiEndpoint:''}};
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch{state=null}state=state||defaults;state.profile={...defaults.profile,...(state.profile||{})};state.settings={...defaults.settings,...(state.settings||{})};['customers','bookings','leads','expenses','doors','territories'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});
let page='Dashboard',activeModal='',map=null,drawMode=false,polygon=[],homeLayer=null,markers=[];
$('#today').textContent=today.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
function save(){localStorage.setItem(KEY,JSON.stringify(state));$('#saveState').textContent='● Saved on this device';}
function toast(m){$('#toast').textContent=m;$('#toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function badge(s){let c=['Completed','Won','Yes','Active'].includes(s)?'green':['Maybe','Follow-up','Quoted','Needs confirmation'].includes(s)?'amber':['No','Lost','Cancelled','Do not contact'].includes(s)?'red':'';return '<span class="pill '+c+'">'+String(s||'').replace(/[&<>]/g,'')+'</span>'}
function setPage(p){page=p;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$$('.section').forEach(s=>s.classList.toggle('active',s.id===p));$('#crumb').textContent=p==='Dashboard'?'BUSINESS OVERVIEW':p.toUpperCase();$('#title').textContent=p==='Dashboard'?'Good day, '+(state.profile.name||'Jacob'):p;$('#topAction').style.display=['Dashboard','Bookings'].includes(p)?'inline-block':'none';$('#accountBtn').textContent=state.profile.signedIn?'Signed in':'Sign in';render();if(p==='Territory')setTimeout(initMap,80)}
function table(headers,rows){return '<div class="tablewrap"><table class="table"><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+headers.length+'" class="empty">Nothing here yet.</td></tr>')+'</tbody></table></div>'}
function dashboard(){let mk=today.toISOString().slice(0,7),rev=state.bookings.filter(b=>String(b.date||b.service_date||'').slice(0,7)===mk&&b.status!=='Cancelled').reduce((s,b)=>s+Number(b.amount||0),0),goal=Number(state.profile.goal||1000),pct=goal?Math.min(100,Math.round(rev/goal*100)):0,open=state.leads.filter(l=>!['Won','Lost'].includes(l.status)).length;let upcoming=state.bookings.filter(b=>String(b.date||b.service_date||'')>=iso(today)&&b.status!=='Cancelled').sort((a,b)=>String(a.date||a.service_date).localeCompare(String(b.date||b.service_date))).slice(0,4);let bars=Array.from({length:14},(_,i)=>{let d=new Date(today);d.setDate(d.getDate()-13+i);return{d,v:state.bookings.filter(b=>String(b.date||b.service_date)===iso(d)&&b.status!=='Cancelled').reduce((s,b)=>s+Number(b.amount||0),0)}}),max=Math.max(150,...bars.map(x=>x.v)),pts=bars.map((x,i)=>[20+i*565/13,190-x.v/max*155]);return '<div class="metrics"><div class="card metric"><label>Revenue this month</label><div class="value">'+money(rev)+'</div><div class="hint">Booked work · excluding cancelled</div></div><div class="card metric"><label>Booked jobs</label><div class="value">'+state.bookings.filter(b=>String(b.date||b.service_date||'').slice(0,7)===mk&&b.status!=='Cancelled').length+'</div><div class="hint">This month</div></div><div class="card metric"><label>Doors tracked</label><div class="value">'+state.doors.length+'</div><div class="hint">Across your territory</div></div><div class="card metric"><label>Open leads</label><div class="value">'+open+'</div><div class="hint">Need follow-up</div></div></div><div class="grid2"><div class="card"><div class="head"><div><h2>Revenue over time</h2><div class="sub">Daily booked revenue · last 14 days</div></div><span class="pill">'+money(rev)+' MTD</span></div><div class="chartbox"><svg viewBox="0 0 610 220" preserveAspectRatio="none">'+[40,90,140,190].map(y=>'<line x1="20" y1="'+y+'" x2="590" y2="'+y+'" class="axis"/>').join('')+'<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" class="cline"/>'+pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#2d8ccd"/>').join('')+'</svg></div></div><div class="card"><div class="head"><div><h2>Monthly goal</h2><div class="sub">Revenue progress</div></div></div><div class="goal"><div class="amount">'+money(rev)+' <span class="sub">/ '+money(goal)+'</span></div><div class="progress"><span style="width:'+pct+'%"></span></div><div class="goalfoot"><span>'+pct+'% complete</span><span>'+money(Math.max(0,goal-rev))+' to go</span></div></div><div class="head"><h2>Next jobs</h2><button class="btn" data-page="Bookings">View all</button></div><div class="jobs">'+(upcoming.length?upcoming.map(b=>{let d=new Date((b.date||b.service_date)+'T12:00:00');return '<div class="job"><div class="datebox"><b>'+d.getDate()+'</b><small>'+d.toLocaleDateString('en-US',{month:'short'})+'</small></div><div class="jobinfo"><b>'+esc(b.name||b.customer_name||'Customer')+'</b><small>'+esc(b.service_time||'')+' · '+esc(b.service||'Window cleaning')+'</small></div><div class="jobprice">'+money(b.amount)+'</div></div>'}).join(''):'<div class="empty">No upcoming jobs.</div>')+'</div></div></div><div class="grid2b"><div class="card"><div class="head"><div><h2>Recent bookings</h2><div class="sub">Latest scheduled work</div></div><button class="btn" data-page="Bookings">Manage</button></div>'+table(['CUSTOMER','DATE','STATUS','REVENUE'],state.bookings.slice().sort((a,b)=>String(b.date||b.service_date).localeCompare(String(a.date||a.service_date))).slice(0,5).map(b=>'<tr><td><b>'+esc(b.name||b.customer_name)+'</b></td><td>'+esc(b.date||b.service_date)+'</td><td>'+badge(b.status)+'</td><td><b>'+money(b.amount)+'</b></td></tr>'))+'</div><div class="card"><div class="head"><div><h2>Quick actions</h2><div class="sub">Run the business from here</div></div></div><div class="quick"><button data-modal="booking">＋ New booking<span>Schedule a job</span></button><button data-modal="lead">＋ Add lead<span>Save a prospect</span></button><button data-modal="customer">＋ Customer<span>Add a contact</span></button><button data-page="Territory">⌖ Territory<span>Scan and mark homes</span></button><button data-modal="expense">＄ Expense<span>Track business costs</span></button><button data-page="Account">⚙ Account<span>Map + AI settings</span></button></div></div></div>'}
function render(){let c;switch(page){case'Dashboard':c=dashboard();break;case'Customers':c='<div class="card panel"><div class="panelhead"><div><h2>Customers</h2><p>Contacts, addresses, and service history.</p></div><button class="btn primary" data-modal="customer">＋ Add customer</button></div><div class="toolbar"><input class="field" id="customerSearch" placeholder="Search name, phone, email, address…"></div><div id="customerTable"></div></div>';break;case'Bookings':c='<div class="card panel"><div class="panelhead"><div><h2>Bookings</h2><p>Appointments, service details, and expected revenue.</p></div><button class="btn primary" data-modal="booking">＋ New booking</button></div><div class="toolbar"><select class="field" id="bookingFilter"><option>All bookings</option><option>Upcoming</option><option>Completed</option><option>Needs confirmation</option><option>Cancelled</option></select></div><div id="bookingTable"></div></div>';break;case'Leads':c='<div class="card panel"><div class="panelhead"><div><h2>Lead pipeline</h2><p>Door-to-door prospects, quotes, and follow-ups.</p></div><button class="btn primary" data-modal="lead">＋ Add lead</button></div><div id="leadTable"></div></div>';break;case'Territory':c=territoryPage();break;case'Finances':c=financePage();break;default:c=accountPage()}$('#'+page).innerHTML=c;if(page==='Customers')renderCustomers();if(page==='Bookings')renderBookings();if(page==='Leads')renderLeads();if(page==='Account')wireAccount();if(page==='Territory')wireTerritory()}
function territoryPage(){return '<div class="panelhead"><div><h2>Territory & home tracker</h2><p>Outline a service area, use satellite imagery, find homes, then mark each doorstep.</p></div><button class="btn primary" data-modal="door">＋ Add doorstep</button></div><div class="mapgrid"><div class="card mapcard"><div class="head"><div><h2>Prospecting map</h2><div class="sub" id="mapProvider">Loading map…</div></div><span class="pill" id="mapStatus">Ready</span></div><div class="maptools"><button class="btn" id="drawTerritory">✎ Draw territory</button><button class="btn" id="finishTerritory">Finish</button><button class="btn" id="clearTerritory">Clear</button><button class="btn" id="streetView">Street</button><button class="btn" id="satView">Satellite</button><button class="btn" id="findHomes">⌕ Find mapped homes</button><button class="btn primary" id="aiScan">✦ AI satellite scan</button></div><div class="map" id="territoryMap"><div class="mapnote" id="mapNote">Click Draw territory, then click around the map to outline a service area.</div></div><div class="mapfoot" id="scanNote">Mapped-home scan uses building footprints. AI scan uses your configured satellite-vision endpoint.</div></div><div class="card panel"><div class="head" style="padding:0 0 10px"><div><h2>Door status</h2><div class="sub">Color-coded field tracking</div></div></div><div class="legend"><div><span class="dot" style="background:#71869a"></span>Not knocked</div><div><span class="dot" style="background:#bd554d"></span>Said no</div><div><span class="dot" style="background:#b97912"></span>Maybe</div><div><span class="dot" style="background:#16845b"></span>Yes</div></div><select class="field" id="doorFilter" style="width:100%"><option value="all">All statuses</option><option value="not">Not knocked</option><option value="no">Said no</option><option value="maybe">Maybe</option><option value="yes">Yes</option></select><div class="list" id="doorList"></div><div class="notice"><b>Important:</b> home detection results are candidates and should be verified in the field. Satellite imagery can miss or misclassify structures.</div></div></div>'}
function financePage(){let mk=today.toISOString().slice(0,7),rev=state.bookings.filter(b=>String(b.date||b.service_date).slice(0,7)===mk&&b.status!=='Cancelled').reduce((s,b)=>s+Number(b.amount||0),0),cost=state.expenses.filter(e=>String(e.date||e.expense_date).slice(0,7)===mk).reduce((s,e)=>s+Number(e.amount||0),0);return '<div class="metrics"><div class="card metric"><label>Revenue this month</label><div class="value">'+money(rev)+'</div></div><div class="card metric"><label>Expenses this month</label><div class="value">'+money(cost)+'</div></div><div class="card metric"><label>Net before tax</label><div class="value">'+money(rev-cost)+'</div></div><div class="card metric"><label>Monthly goal</label><div class="value">'+money(state.profile.goal)+'</div></div></div><div class="card panel"><div class="panelhead"><div><h2>Expenses</h2><p>Track supplies, fuel, marketing, insurance, and equipment.</p></div><button class="btn primary" data-modal="expense">＋ Add expense</button></div><div id="expenseTable"></div></div>'}
function accountPage(){return '<div class="card panel"><div class="panelhead"><div><h2>Account & integrations</h2><p>Profile, device persistence, Google Maps, and AI satellite scanning.</p></div><span class="pill '+(state.profile.signedIn?'green':'')+'">'+(state.profile.signedIn?'Signed in':'Local workspace')+'</span></div><form id="accountForm" class="formgrid"><label>Your name<input name="name" value="'+esc(state.profile.name)+'" required></label><label>Business name<input name="business" value="'+esc(state.profile.business)+'" required></label><label>Phone<input name="phone" value="'+esc(state.profile.phone)+'"></label><label>Email<input name="email" type="email" value="'+esc(state.profile.email)+'"></label><label>Monthly revenue goal ($)<input name="goal" type="number" min="1" step="50" value="'+Number(state.profile.goal||1000)+'"></label><div class="wide"><button class="btn primary">Save profile</button></div></form><div class="settingrow"><span>Google Maps JavaScript API key</span><input id="googleKey" type="password" value="'+esc(state.settings.googleKey)+'" placeholder="AIza…"></div><button class="btn" id="saveGoogle">Save Google Maps key</button><div class="settingrow"><span>AI satellite scan endpoint</span><input id="aiEndpoint" value="'+esc(state.settings.aiEndpoint)+'" placeholder="https://your-domain.example/api/scan-homes"></div><button class="btn" id="saveAI">Save AI endpoint</button><div class="notice"><b>Persistence:</b> your workspace data is stored in this browser with local storage. Secure cloud authentication and cross-device sync still require the deployed Supabase backend.</div><div class="toolbar" style="margin-top:16px"><button class="btn" id="exportData">Export data (JSON)</button><button class="btn" id="clearData">Clear local data</button></div></div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderCustomers(){let q=($('#customerSearch')?.value||'').toLowerCase(),rows=state.customers.filter(x=>(x.name+x.phone+x.email+x.address).toLowerCase().includes(q)).map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.phone||'—')+'</td><td>'+esc(x.email||'—')+'</td><td>'+esc(x.address||'—')+'</td><td>'+badge(x.status||'Active')+'</td><td><button class="btn" data-remove="customer" data-id="'+x.id+'">Remove</button></td></tr>');$('#customerTable').innerHTML=table(['CUSTOMER','PHONE','EMAIL','ADDRESS','STATUS',''],rows);$('#customerSearch')?.addEventListener('input',renderCustomers)}
function renderBookings(){let f=$('#bookingFilter')?.value||'All bookings',rows=state.bookings.filter(b=>f==='All bookings'||(f==='Upcoming'?String(b.date||b.service_date)>=iso(today)&&b.status!=='Cancelled':b.status===f)).sort((a,b)=>String(a.date||a.service_date).localeCompare(String(b.date||b.service_date))).map(b=>'<tr><td><b>'+esc(b.date||b.service_date)+'</b><br><span class="sub">'+esc(b.service_time||'')+'</span></td><td>'+esc(b.name||b.customer_name)+'</td><td>'+esc(b.service||'Window cleaning')+'</td><td>'+esc(b.address||'—')+'</td><td><b>'+money(b.amount)+'</b></td><td>'+badge(b.status)+'</td><td><button class="btn" data-remove="booking" data-id="'+b.id+'">Remove</button></td></tr>');$('#bookingTable').innerHTML=table(['DATE / TIME','CUSTOMER','SERVICE','ADDRESS','REVENUE','STATUS',''],rows);$('#bookingFilter')?.addEventListener('change',renderBookings)}
function renderLeads(){let rows=state.leads.map(l=>'<tr><td><b>'+esc(l.name)+'</b></td><td>'+esc(l.address||'—')+'</td><td>'+esc(l.source||'—')+'</td><td>'+badge(l.status||'New')+'</td><td>'+esc(l.follow||l.next_followup||'—')+'</td><td>'+money(l.estimated||l.estimated_value)+'</td><td><button class="btn" data-remove="lead" data-id="'+l.id+'">Remove</button></td></tr>');$('#leadTable').innerHTML=table(['PROSPECT','ADDRESS','SOURCE','STATUS','FOLLOW-UP','EST. VALUE',''],rows)}
function renderExpenses(){let rows=state.expenses.map(e=>'<tr><td>'+esc(e.date||e.expense_date)+'</td><td>'+esc(e.category)+'</td><td>'+esc(e.note||e.notes||'—')+'</td><td><b>'+money(e.amount)+'</b></td><td><button class="btn" data-remove="expense" data-id="'+e.id+'">Remove</button></td></tr>');$('#expenseTable').innerHTML=table(['DATE','CATEGORY','NOTE','AMOUNT',''],rows)}
function renderDoors(){let f=$('#doorFilter')?.value||'all',arr=state.doors.filter(d=>f==='all'||d.status===f);$('#doorList').innerHTML=arr.map(d=>'<div class="home"><main><b>'+esc(d.address||'Detected home')+'</b><small>'+esc(d.source||'manual')+(d.confidence!=null?' · '+Math.round(Number(d.confidence)*100)+'% confidence':'')+'</small></main><select class="field" data-door-status="'+d.id+'">'+options(d.status)+'</select></div>').join('')||'<div class="empty">No homes in this view.</div>'}
function options(s){return[['not','Not knocked'],['no','Said no'],['maybe','Maybe'],['yes','Yes']].map(x=>'<option value="'+x[0]+'" '+(s===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')}
function openModal(type){activeModal=type;let schema={booking:[['name','Customer name','text',1],['date','Service date','date',1],['service_time','Start time','time',1],['service','Service','text',1],['amount','Expected revenue ($)','number',1],['status','Status','select',1,['Booked','Completed','Needs confirmation','Cancelled']],['address','Service address','text',1],['notes','Job notes','textarea',0]],customer:[['name','Customer name','text',1],['phone','Phone','tel',0],['email','Email','email',0],['address','Address','text',0],['status','Status','select',1,['Active','Past','Do not contact']],['notes','Notes','textarea',0]],lead:[['name','Prospect name','text',1],['phone','Phone','tel',0],['email','Email','email',0],['address','Address','text',0],['source','Source','select',1,['Door-to-door','Referral','Website','Call','Other']],['status','Status','select',1,['New','Contacted','Follow-up','Quoted','Won','Lost']],['estimated','Estimated value ($)','number',1],['follow','Next follow-up','date',0],['notes','Notes','textarea',0]],expense:[['date','Date','date',1],['category','Category','select',1,['Supplies','Fuel','Marketing','Insurance','Equipment','Other']],['amount','Amount ($)','number',1],['note','Note','text',0]],door:[['address','Address','text',1],['status','Doorstep status','select',1,['not','no','maybe','yes']],['lat','Latitude (optional)','number',0],['lng','Longitude (optional)','number',0],['note','Note','text',0]]},titles={booking:'New booking',customer:'Add customer',lead:'Add lead',expense:'Log expense',door:'Add doorstep'};$('#modalTitle').textContent=titles[type];$('#modalFields').innerHTML=schema[type].map(([n,l,t,req,opts])=>'<label class="'+(t==='textarea'?'wide':'')+'">'+l+(t==='select'?'<select name="'+n+'">'+opts.map(o=>'<option value="'+o+'">'+(statusText[o]||o)+'</option>').join('')+'</select>':t==='textarea'?'<textarea name="'+n+'"></textarea>':'<input name="'+n+'" type="'+t+'" '+(req?'required':'')+(t==='date'?' value="'+iso(today)+'"':'')+(n==='service'?' value="Exterior window cleaning"':'')+(t==='number'?' min="0" step="0.01"':'')+'>')+'</label>').join('');$('#modal').classList.add('show')}
const statusText={not:'Not knocked',no:'Said no',maybe:'Maybe',yes:'Yes'};function closeModal(){$('#modal').classList.remove('show');activeModal=''}
$('#modalForm').addEventListener('submit',e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=crypto.randomUUID();['amount','estimated','lat','lng'].forEach(k=>{if(k in o)o[k]=o[k]===''?null:Number(o[k])});if(activeModal==='booking')state.bookings.unshift(o);if(activeModal==='customer')state.customers.unshift(o);if(activeModal==='lead')state.leads.unshift(o);if(activeModal==='expense')state.expenses.unshift(o);if(activeModal==='door'){o.source='manual';state.doors.unshift(o)}closeModal();save();toast('Saved');render();if(page==='Territory')initMap()});
$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){setPage(b.dataset.page);return}let m=e.target.closest('[data-modal]');if(m){openModal(m.dataset.modal);return}let r=e.target.closest('[data-remove]');if(r){let arr={customer:'customers',booking:'bookings',lead:'leads',expense:'expenses'}[r.dataset.remove];state[arr]=state[arr].filter(x=>String(x.id)!==String(r.dataset.id));save();toast('Removed');render();return}});
document.addEventListener('change',e=>{let id=e.target.dataset.doorStatus;if(id){let d=state.doors.find(x=>String(x.id)===String(id));if(d){d.status=e.target.value;save();if(page==='Territory')initMap();else render()}}});
$('#topAction').onclick=()=>openModal('booking');$('#accountBtn').onclick=()=>setPage('Account');
function wireAccount(){let f=$('#accountForm');if(f)f.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(f));state.profile={...state.profile,name:o.name.trim(),business:o.business.trim()||'Cool Dudes Window Cleaning',phone:o.phone.trim(),email:o.email.trim(),goal:Number(o.goal||1000)};state.profile.signedIn=true;save();toast('Profile saved');setPage('Dashboard')};$('#saveGoogle')?.addEventListener('click',()=>{state.settings.googleKey=$('#googleKey').value.trim();save();toast('Google Maps key saved')});$('#saveAI')?.addEventListener('click',()=>{state.settings.aiEndpoint=$('#aiEndpoint').value.trim();save();toast('AI endpoint saved')});$('#exportData')?.addEventListener('click',()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='cool-dudes-field-desk.json';a.click()});$('#clearData')?.addEventListener('click',()=>{if(confirm('Clear all local workspace data?')){localStorage.removeItem(KEY);location.reload()}})}
function initMap(){if(page!=='Territory'||!window.L)return;let el=$('#territoryMap');if(!map){map=L.map(el).setView([41.433,-96.49],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);map.on('click',e=>{if(drawMode){polygon.push([e.latlng.lat,e.latlng.lng]);drawPoly()}})}map.invalidateSize();clearMarkers();state.doors.filter(d=>d.lat!=null&&d.lng!=null).forEach(d=>addMarker(d));drawPoly();$('#mapProvider').textContent='Leaflet map · live street layer';bindTerritory()}
function clearMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[];if(homeLayer){map.removeLayer(homeLayer);homeLayer=null}}
function statusColor(s){return{not:'#71869a',no:'#bd554d',maybe:'#b97912',yes:'#16845b'}[s]||'#71869a'}
function addMarker(d){let m=L.circleMarker([+d.lat,+d.lng],{radius:8,color:'#fff',weight:2,fillColor:statusColor(d.status),fillOpacity:.95}).addTo(map);m.bindPopup('<b>'+esc(d.address||'Detected home')+'</b><br><select id="popup-'+d.id+'" style="width:100%;margin-top:7px;padding:6px">'+options(d.status)+'</select>');m.on('popupopen',()=>{let s=document.getElementById('popup-'+d.id);if(s)s.onchange=()=>{d.status=s.value;save();m.setStyle({fillColor:statusColor(d.status)});renderDoors()}});markers.push(m)}
function drawPoly(){if(!map)return;if(window._cdPoly)map.removeLayer(window._cdPoly);if(polygon.length>=3)window._cdPoly=L.polygon(polygon,{color:'#1769aa',weight:3,dashArray:'8 5',fillColor:'#1769aa',fillOpacity:.18}).addTo(map)}
function bindTerritory(){let d=$('#drawTerritory');if(d)d.onclick=()=>{drawMode=true;$('#mapNote').textContent='Drawing mode: click around the map to add boundary points.';toast('Drawing mode on')};$('#finishTerritory').onclick=()=>{if(polygon.length<3)return toast('Add at least 3 points');drawMode=false;localStorage.setItem(KEY,JSON.stringify({...state,territory:polygon}));$('#mapNote').textContent='Territory outlined. Scan for homes when ready.';toast('Territory saved')};$('#clearTerritory').onclick=()=>{polygon=[];drawMode=false;drawPoly();localStorage.setItem(KEY,JSON.stringify({...state,territory:[]}));toast('Territory cleared')};$('#streetView').onclick=()=>setTiles('street');$('#satView').onclick=()=>setTiles('satellite');$('#findHomes').onclick=scanMappedHomes;$('#aiScan').onclick=scanAISatellite;$('#doorFilter').onchange=renderDoors;renderDoors()}
function setTiles(mode){map.eachLayer(l=>{if(l instanceof L.TileLayer)map.removeLayer(l)});L.tileLayer(mode==='satellite'?'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}':'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:mode==='satellite'?'Imagery © Esri':'© OpenStreetMap contributors'}).addTo(map);$('#mapNote').textContent=mode==='satellite'?'Satellite/aerial imagery enabled.':'Street map enabled.'}
function pointInPoly(lat,lng,poly){let inside=false,j=poly.length-1;for(let i=0;i<poly.length;i++){let yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1],hit=((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/((yj-yi)||1e-12)+xi);if(hit)inside=!inside;j=i}return inside}
async function scanMappedHomes(){if(polygon.length<3)return toast('Draw and finish a territory first');$('#mapStatus').textContent='Scanning…';$('#scanNote').textContent='Searching mapped residential building footprints…';try{let coords=polygon.map(p=>p[0]+' '+p[1]).join(' '),q='[out:json][timeout:30];way["building"](poly:"'+coords+'");out center tags;';let r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));if(!r.ok)throw Error('building service '+r.status);let j=await r.json(),added=0;for(let e of(j.elements||[])){let b=e.tags?.building||'';if(!e.center||!['house','residential','detached','semidetached_house','terrace','bungalow','apartments'].includes(b))continue;let ext='osm/'+e.type+'/'+e.id;if(state.doors.some(d=>d.external_id===ext))continue;let address=[e.tags?.['addr:housenumber'],e.tags?.['addr:street']].filter(Boolean).join(' ');state.doors.push({id:crypto.randomUUID(),external_id:ext,address:address||'Mapped home '+(state.doors.length+1),status:'not',lat:e.center.lat,lng:e.center.lon,source:'OSM mapped building'});added++}save();$('#mapStatus').textContent='Scan complete';$('#scanNote').textContent='Added '+added+' mapped residential building candidates. These are map-data results, not visual AI detections.';toast('Added '+added+' mapped homes');initMap()}catch(e){$('#scanNote').textContent='Mapped-home scan failed: '+e.message;toast('Home scan failed')}}
async function scanAISatellite(){if(polygon.length<3)return toast('Draw and finish a territory first');if(!state.settings.aiEndpoint)return toast('Add an AI scan endpoint in Account first');$('#mapStatus').textContent='AI scanning…';$('#scanNote').textContent='Sending the territory polygon to your satellite-vision backend…';try{let r=await fetch(state.settings.aiEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({polygon:polygon,provider:'google-maps',map_mode:'satellite',task:'detect_visible_homes'})});if(!r.ok)throw Error('AI service '+r.status);let j=await r.json(),homes=Array.isArray(j.homes)?j.homes:[],added=0;for(let h of homes){if(typeof h.lat!=='number'||typeof h.lng!=='number'||!pointInPoly(h.lat,h.lng,polygon))continue;let ext='ai/'+h.lat.toFixed(6)+'/'+h.lng.toFixed(6);if(state.doors.some(d=>d.external_id===ext))continue;state.doors.push({id:crypto.randomUUID(),external_id:ext,address:h.address||'AI detected home '+(state.doors.length+1),status:['not','no','maybe','yes'].includes(h.status)?h.status:'not',lat:h.lat,lng:h.lng,source:'AI satellite',confidence:h.confidence==null?null:Number(h.confidence),note:h.note||''});added++}save();$('#mapStatus').textContent='AI scan complete';$('#scanNote').textContent='AI returned '+homes.length+' candidates and added '+added+' new homes. Verify results in the field.';toast('AI scan added '+added+' homes');initMap()}catch(e){$('#scanNote').textContent='AI scan failed: '+e.message;toast('AI scan failed')}}
setPage('Dashboard');save();
</script>
